* {
  margin: 0;

}

/* Gallery container */
.image-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
  padding: 40px;
  background-color: #f8f8f8;
}

/* Each image container */
.gallery-item {
  overflow: hidden;
  border-radius: 15px;
  position: relative;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
  transition: transform 0.3s ease;
}

/* Image styling */
.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform 0.5s ease, opacity 0.3s ease;
}

/* Hover effects */
.gallery-item:hover {
  transform: translateY(-8px);
}

.gallery-item:hover img {
  transform: scale(1.1);
  opacity: 0.9;
}

/* Optional: make it look sleek on dark mode */
@media (prefers-color-scheme: dark) {
  .image-gallery {
    background-color: #121212;
  }
}

    function loadPage(page) {
      const content = document.getElementById("content");
      content.innerHTML = pages[page] || pages.home;
      window.scrollTo({ top: 0, behavior: "smooth" });

      document.querySelectorAll('.fade-in').forEach(el => {
        setTimeout(() => el.classList.add('show'), 100);
      });

      document.querySelectorAll('.nav-links a').forEach(link => link.classList.remove('active'));
      var active = document.getElementById(`link-${page}`);
      if (active) active.classList.add('active');

      document.getElementById("navLinks").classList.remove("active");

      if (page === 'vote') bindVoteForm();
    }

    function isVotingClosed() {
      if (TEST_MODE || !VOTE_CLOSE_DATE) return false;
      var end = new Date(VOTE_CLOSE_DATE);
      if (isNaN(end.getTime())) return false;
      return new Date() > end;
    }

    function isVotingNotYetOpen() {
      if (TEST_MODE || !VOTE_OPEN_DATE) return false;
      var start = new Date(VOTE_OPEN_DATE);
      if (isNaN(start.getTime())) return false;
      return new Date() < start;
    }

    function formatDate(dateStr) {
      var d = new Date(dateStr);
      return d.toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
    }

    function formatDeadline() {
      var end = new Date(VOTE_CLOSE_DATE);
      return end.toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' }) +
             ' at ' + end.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
    }

    function bindVoteForm() {
      var wrap = document.querySelector('.vote-wrap');

      if (isVotingNotYetOpen()) {
        if (wrap) {
          wrap.innerHTML =
            '<div class="vote-notopen"><h2>Voting Opens Soon \uD83D\uDD52</h2>' +
            '<p>Voting for <strong>Light Up Your Community!</strong> opens on ' + formatDate(VOTE_OPEN_DATE) + '.</p>' +
            '<p>Voting period: ' + formatDate(VOTE_OPEN_DATE) + ' to ' + formatDate(VOTE_CLOSE_DATE) + '. Please check back then to cast your vote!</p>' +
            '<a onclick="loadPage(\'home\')" class="btn">Back to Home</a></div>';
        }
        return;
      }

      if (isVotingClosed()) {
        if (wrap) {
          wrap.innerHTML =
            '<div class="vote-closed"><h2>Voting Has Closed \u23F0</h2>' +
            '<p>Thank you for participating! Voting for the <strong>Light Up Your Community!</strong> project ended on ' + formatDeadline() + '.</p>' +
            '<p>The winning state will be announced soon. Super Members in the Super House... We Moove!!!</p>' +
            '<a onclick="loadPage(\'home\')" class="btn">Back to Home</a></div>';
        }
        return;
      }

      var form = document.getElementById('voteForm');
      var status = document.getElementById('formStatus');
      var emailInput = form ? form.querySelector('input[name="email"]') : null;
      var emailError = document.getElementById('emailError');
      var deadlineNote = document.getElementById('voteDeadline');
      if (!form) return;

      if (deadlineNote) {
        deadlineNote.textContent = 'Voting period: ' + formatDate(VOTE_OPEN_DATE) + ' to ' + formatDeadline() + '.' + (TEST_MODE ? ' (TEST MODE - remember to turn this off before going live)' : '');
      }

      var emailRe = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

      function checkEmail() {
        if (!emailInput) return true;
        var v = emailInput.value.trim();
        if (v && !emailRe.test(v)) {
          emailInput.classList.add('touched');
          if (emailError) emailError.textContent = 'Please enter a valid email address (e.g. name@example.com).';
          return false;
        }
        if (emailError) emailError.textContent = '';
        return true;
      }
      if (emailInput) emailInput.addEventListener('blur', checkEmail);

      form.addEventListener('submit', function(e){
        e.preventDefault();
        status.className = 'form-status';

        if (isVotingNotYetOpen()) { status.className = 'form-status err'; status.textContent = 'Voting has not opened yet.'; return; }
        if (isVotingClosed())     { status.className = 'form-status err'; status.textContent = 'Sorry, voting has just closed.'; return; }

        if (!checkEmail()) {
          status.className = 'form-status err';
          status.textContent = 'Please fix the highlighted field.';
          if (emailInput) emailInput.focus();
          return;
        }

        status.textContent = 'Sending your vote...';

        var data = new FormData(form);
        fetch(FORM_ENDPOINT, {
          method: 'POST',
          body: data,
          headers: { 'Accept': 'application/json' }
        }).then(function(res){ return res.json().then(function(d){ return { ok: res.ok, body: d }; }); })
        .then(function(r){
          if (r.ok && (r.body.success === 'true' || r.body.success === true)) {
            document.querySelector('.vote-wrap').innerHTML =
              '<div class="thankyou"><h2>Thank you for voting! \uD83C\uDF89</h2>' +
              '<p>Your vote for the <strong>Light Up Your Community!</strong> project has been recorded and sent to our team. A confirmation has been sent to your email.</p>' +
              '<p>Super Members in the Super House... We Moove!!!</p>' +
              '<a onclick="loadPage(\'home\')" class="btn">Back to Home</a></div>';
          } else {
            status.className = 'form-status err';
            status.textContent = (r.body && r.body.message) ? r.body.message : 'Something went wrong. Please try again.';
          }
        }).catch(function(){
          status.className = 'form-status err';
          status.textContent = 'Network error. Please check your connection and try again.';
        });
      });
    }

    window.onload = () => loadPage('home');
  </script>
