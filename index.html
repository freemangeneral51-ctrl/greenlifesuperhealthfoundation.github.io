<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GREENLIFE SUPER HEALTH FOUNDATION</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:"Arial", sans-serif; }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      line-height:1.6;
    }
    main { flex: 1; }

    /* Navbar */
    header { background:#2c3e50; padding:15px; color:white; position:sticky; top:0; z-index:1000; }
    .navbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:10px; cursor:pointer; }
    .brand img.logo { height:40px; width:auto; max-width:100%; }
    .brand span { font-size:18px; font-weight:bold; color:white; }
    .nav-links { list-style:none; display:flex; gap:20px; }
    .nav-links a { color:white; text-decoration:none; font-weight:bold; cursor:pointer; }
    .nav-links a.active { text-decoration:underline; }
    .menu-toggle { display:none; font-size:28px; cursor:pointer; }

    /* Hero */
    .hero {
      height:auto;
      min-height:90vh;
      background:url('https://picsum.photos/1200/800?nature') center/cover no-repeat;
      color:white;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

    /* Sections */
    .section { padding:50px 20px; text-align:center; }

    /* Buttons */
    .btn {
      background:#27ae60; color:white; padding:10px 20px; margin-top:15px;
      border:none; cursor:pointer; border-radius:5px;
      transition:background 0.3s ease, transform 0.3s ease;
      display:inline-block; text-decoration:none;
    }
    .btn:hover { background:#219150; transform:scale(1.05); }

    /* Projects Grid */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      margin-top: 20px;
    }
    .card {
      background: #f4f4f4;
      padding: 40px;
      border-radius: 12px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
      font-size: 18px;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0px 8px 20px rgba(0,0,0,0.25);
    }
    @media (max-width: 768px) {
      .project-grid { grid-template-columns: 1fr; }
    }

    .contact { background:#ecf0f1; }
    .contact form { max-width:500px; margin:auto; display:flex; flex-direction:column; gap:10px; }

    /* Footer */
    footer { background:#2c3e50; color:white; text-align:center; padding:15px; }
    .powered { font-size: 14px; margin-bottom: 12px; font-weight: bold; text-align: center; }
    .powered .white { color: white; font-size: 14px; }
    .powered .foundation { font-size: 16px; font-weight: bold; color: white; }
    .powered .lemon { font-size: 16px; font-weight: bold; color: #f7f74f; }
    .super-glow {
      display: block; margin-top: 10px; font-size: 16px; font-weight: bold;
      color: #000; animation: glowGold 1.5s ease-in-out infinite alternate;
    }

    /* Animations */
    .fade-in { opacity:0; transform:translateY(30px); transition:all 0.8s ease-out; }
    .fade-in.show { opacity:1; transform:translateY(0); }
    .hero h1, .hero p { animation:fadeSlide 1.2s ease-out forwards; }
    @keyframes fadeSlide { from{opacity:0; transform:translateY(40px);} to{opacity:1; transform:translateY(0);} }

    /* Responsive Navbar */
    @media (max-width:768px) {
      .nav-links { display:none; flex-direction:column; background:#34495e; position:absolute; top:60px; right:0; width:200px; padding:20px; }
      .nav-links.active { display:flex; }
      .menu-toggle { display:block; }
      .brand { flex-direction:column; text-align:center; }
      .brand span { font-size:14px; }
      .brand img.logo { height:30px; }
      .gallery { grid-template-columns:1fr; }
      .what-grid { grid-template-columns:1fr; }
      .image-text-section { flex-direction: column; }
    }

    html { scroll-behavior:smooth; }

    .hero-card {
      background: rgba(255, 255, 255, 0.85); color: #2c3e50; padding: 30px;
      border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.25);
      max-width: 700px; margin-bottom: 20px; text-align: center;
      animation: fadeSlide 1.2s ease-out forwards;
    }
    .hero-card h1 { margin-bottom: 15px; font-size: 28px; }
    .hero-card p { font-size: 16px; margin-bottom: 10px; }

    .fine, .home-banner, .g-fine, .h-fine, .i-fine {
      width: 100%; max-height: 300px; object-fit: cover; margin-top: 20px;
      border-radius: 10px; display: block;
    }
    .sub-heading {
      display: inline-block; margin-top: 25px; padding: 8px 20px; font-size: 20px;
      font-weight: bold; color: #2c3e50; background: #f1c40f; border-radius: 25px;
      text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .f-fine { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; display: block; transition: transform 0.3s ease; }
    .card-img { width: 100%; height: auto; border-radius: 10px; display: block; transition: transform 0.3s ease; }
    .card-img:hover { transform: scale(1.05); }
    .clickable-card { cursor: pointer; padding: 0; background: none; box-shadow: none; }

    .extra-section {
      margin-top: 40px; padding: 30px 20px; background: #ecf0f1; border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1); text-align: center;
    }
    .extra-section h2 { margin-bottom: 15px; font-size: 26px; color: #2c3e50; }

    .mission-list { list-style: none; padding: 0; margin: 20px auto; text-align: left; max-width: 700px; }
    .mission-list li { margin: 12px 0; padding-left: 30px; position: relative; font-size: 16px; color: #2c3e50; line-height: 1.6; }
    .mission-list li::before { content: "\2714"; position: absolute; left: 0; color: #27ae60; font-weight: bold; }

    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
    .gallery img { width: 100%; height: auto; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.15); transition: transform 0.3s ease; }
    .gallery img:hover { transform: scale(1.05); }

    .what-we-do { margin-top: 50px; padding: 40px 20px; background: #fff; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
    .what-we-do h2 { font-size: 28px; margin-bottom: 25px; color: #2c3e50; text-transform: uppercase; letter-spacing: 1.5px; }
    .what-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .what-card { background: #ecf0f1; padding: 20px; border-radius: 10px; transition: transform 0.3s ease, box-shadow 0.3s ease; text-align: center; }
    .what-card h3 { margin-bottom: 10px; color: #27ae60; }
    .what-card p { color: #333; font-size: 15px; line-height: 1.6; }
    .what-card:hover { transform: translateY(-5px); box-shadow: 0px 6px 15px rgba(0,0,0,0.2); }
    .icon { font-size: 40px; color: orange; margin-bottom: 10px; display: block; }

    .image-text-section { margin-top: 50px; display: flex; align-items: center; justify-content: center; gap: 30px; flex-wrap: wrap; padding: 20px; text-align: center; }
    .side-img { max-width: 220px; border-radius: 12px; box-shadow: 0px 6px 15px rgba(0,0,0,0.2); transition: transform 0.3s ease; }
    .side-img:hover { transform: scale(1.05); }
    .middle-text { max-width: 500px; font-size: 24px; font-weight: bold; color: #000; line-height: 1.8; text-align: center; animation: glowGold 1.5s ease-in-out infinite alternate; }
    @keyframes glowGold {
      from { text-shadow: 0 0 5px #f1c40f, 0 0 10px #f39c12, 0 0 20px #e67e22; color: #000; }
      to { text-shadow: 0 0 15px #f1c40f, 0 0 30px #f39c12, 0 0 45px #e67e22, 0 0 60px #f1c40f; color: #000; }
    }
    .about-ban, .about-banner { width: 100%; object-fit: cover; margin-top: 10px; border-radius: 6px; display: block; }
    .project-two { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; margin-top: 20px; }
    .project-list { list-style: none; padding: 0; margin: 15px 0; text-align: left; }
    .project-list li { margin: 10px 0; padding-left: 30px; position: relative; font-size: 16px; color: #2c3e50; line-height: 1.6; }
    .project-list li::before { content: "\2B50"; position: absolute; left: 0; font-size: 18px; }
    @media (max-width: 768px) { .project-two { grid-template-columns: 1fr; } }

    /* ===== Voting Form Page ===== */
    .vote-wrap { max-width: 640px; margin: 0 auto; text-align: left; }
    .vote-intro { text-align: center; color:#2c3e50; margin-bottom: 25px; }
    .vote-form {
      background:#fff; border-radius:14px; padding:30px;
      box-shadow:0 6px 18px rgba(0,0,0,0.12); display:flex; flex-direction:column; gap:22px;
    }
    .vote-field label { display:block; font-weight:bold; color:#2c3e50; margin-bottom:8px; }
    .vote-field input[type="text"], .vote-field input[type="email"], .vote-field select, .vote-field textarea {
      width:100%; padding:12px; border:1px solid #cfd8dc; border-radius:8px; font-size:15px;
    }
    .vote-field textarea { resize:vertical; min-height:90px; }
    .required { color:#e74c3c; }
    .hint { font-weight:normal; font-size:13px; color:#7f8c8d; }

    /* Star rating */
    .stars { display:flex; flex-direction:row-reverse; justify-content:flex-end; gap:6px; }
    .stars input { display:none; }
    .stars label { font-size:34px; color:#d0d0d0; cursor:pointer; transition:color .2s ease; }
    .stars input:checked ~ label,
    .stars label:hover, .stars label:hover ~ label { color:#f1c40f; }

    /* 1-10 scale radios */
    .scale { display:flex; flex-wrap:wrap; gap:8px; }
    .scale label {
      display:inline-flex; align-items:center; justify-content:center;
      width:42px; height:42px; border:2px solid #27ae60; border-radius:50%;
      color:#27ae60; font-weight:bold; cursor:pointer; transition:all .2s ease; margin:0;
    }
    .scale input { display:none; }
    .scale input:checked + label { background:#27ae60; color:#fff; transform:scale(1.08); }

    .vote-submit { align-self:center; }
    .form-status { text-align:center; font-weight:bold; margin-top:6px; min-height:22px; }
    .form-status.ok { color:#27ae60; }
    .form-status.err { color:#e74c3c; }
    .thankyou {
      background:#eafaf1; border:2px solid #27ae60; color:#1e7e46;
      border-radius:14px; padding:40px 25px; text-align:center; max-width:640px; margin:0 auto;
    }
    .thankyou h2 { color:#27ae60; margin-bottom:10px; }
    .field-error { color:#e74c3c; font-size:13px; margin-top:6px; min-height:16px; font-weight:bold; }
    .vote-field input:invalid.touched { border-color:#e74c3c; }
    .vote-closed {
      background:#fdecea; border:2px solid #e74c3c; color:#a93226;
      border-radius:14px; padding:40px 25px; text-align:center; max-width:640px; margin:0 auto;
    }
    .vote-closed h2 { color:#c0392b; margin-bottom:10px; }
    .vote-deadline { text-align:center; font-size:14px; color:#7f8c8d; margin-top:14px; }
    .vote-banner { text-align:center; margin-bottom:22px; }
    .vote-tag {
      display:inline-block; background:#f1c40f; color:#2c3e50; font-weight:bold;
      padding:6px 16px; border-radius:20px; letter-spacing:1px; text-transform:uppercase;
      font-size:13px; margin-bottom:12px;
    }
    .checkbox-field label { display:flex; align-items:flex-start; gap:10px; font-weight:normal; color:#2c3e50; }
    .checkbox-field input[type="checkbox"] { width:18px; height:18px; margin-top:3px; flex-shrink:0; }
    .vote-notopen {
      background:#fef9e7; border:2px solid #f1c40f; color:#8a6d00;
      border-radius:14px; padding:40px 25px; text-align:center; max-width:640px; margin:0 auto;
    }
    .vote-notopen h2 { color:#b7950b; margin-bottom:10px; }
    /* Home promo banner for Light Up Your Community */
    .promo-banner {
      max-width:760px; margin:30px auto 0; cursor:pointer;
      background:linear-gradient(135deg,#2c3e50,#27ae60);
      color:#fff; border-radius:16px; padding:30px 25px; text-align:center;
      box-shadow:0 8px 22px rgba(0,0,0,0.28); transition:transform .3s ease, box-shadow .3s ease;
    }
    .promo-banner:hover { transform:translateY(-4px); box-shadow:0 12px 30px rgba(0,0,0,0.35); }
    .promo-flash {
      display:inline-block; background:#e74c3c; color:#fff; font-weight:bold;
      padding:5px 14px; border-radius:20px; font-size:13px; letter-spacing:1px;
      text-transform:uppercase; margin-bottom:12px; animation:glowGold 1.5s ease-in-out infinite alternate;
    }
    .promo-banner h2 { font-size:26px; margin-bottom:12px; color:#f1c40f; }
    .promo-banner p { font-size:16px; margin-bottom:8px; }
    .promo-dates { font-size:14px; font-weight:bold; color:#f7f74f; margin:12px 0 18px; }
    .promo-btn { background:#f1c40f; color:#2c3e50; font-weight:bold; }
    .promo-banner:hover .promo-btn { background:#f39c12; }

  </style>
</head>

              </div>
              <div class="vote-field">
                <label>Your Email <span class="required">*</span> <span class="hint">(for confirmation)</span></label>
                <input type="email" name="email" required placeholder="you@example.com"
                       pattern="[^@\\s]+@[^@\\s]+\\.[^@\\s]+" title="Please enter a valid email address">
                <div class="field-error" id="emailError"></div>
              </div>
              <div class="vote-field">
                <label>Your Greenlife Zone <span class="required">*</span></label>
                <select name="zone" required>
                  <option value="" disabled selected>Select your zone</option>
                  <option>Western Zone (Head Office)</option>
                  <option>Northern Zone (Branch Office)</option>
                  <option>South East / South South Zone (Branch Office)</option>
                </select>
              </div>
              <div class="vote-field">
                <label>Which STATE should the project come to first? <span class="required">*</span></label>
                <select name="state_vote" required>
                  <option value="" disabled selected>Select a state</option>
                  ${NG_STATES.map(function(s){return '<option>'+s+'</option>';}).join('')}
                </select>
              </div>
              <div class="vote-field">
                <label>Greenlife Membership Rank <span class="required">*</span> <span class="hint">(must be Planner / Step 3 &amp; above to qualify)</span></label>
                <select name="rank" required>
                  <option value="" disabled selected>Select your rank</option>
                  <option>Planner (Step 3)</option>
                  <option>Step 4</option>
                  <option>Step 5</option>
                  <option>Step 6 and above</option>
                </select>
              </div>
              <div class="vote-field">
                <label>Greenlife Membership / Planner ID <span class="hint">(optional)</span></label>
                <input type="text" name="member_id" placeholder="Your Greenlife ID">
              </div>
              <div class="vote-field checkbox-field">
                <label><input type="checkbox" name="eligibility" value="Confirmed Planner (Step 3) and above" required> I confirm I am a Greenlife Planner (Step 3) and above. <span class="required">*</span></label>
              </div>
              <div class="vote-field">
                <label>Why should the project come to your state? <span class="hint">(optional)</span></label>
                <textarea name="comments" placeholder="Tell us why your community deserves to be lit up..."></textarea>
              </div>
              <button type="submit" class="btn vote-submit">Submit My Vote</button>
              <div class="form-status" id="formStatus"></div>
            </form>
            <p class="vote-deadline" id="voteDeadline"></p>
          </div>
        </section>
      `,
      contact: `
        <section class="section contact fade-in">
          <h2>Contact Us</h2>
          <p>Have questions or want to partner with us? We&rsquo;d love to hear from you.</p>
          <p>@ No.18 Adebayo Crescent Ago by Ago Roundabout, Okota-Isolo Lagos State, Nigeria.</p>
          <br>
          <h2>Connect with us</h2>
          <p>
            You can also connect with us on WhatsApp
            <a href="https://wa.me/23470602884" target="_blank" rel="noopener">+23470602884</a>,
            <a href="https://wa.me/2348037188332" target="_blank" rel="noopener">+2348037188332</a>.
          </p>
        </section>
      `
    };
    function loadPage(page) {
      const content = document.getElementById("content");
      content.innerHTML = pages[page] || pages.home;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.querySelectorAll('.fade-in').forEach(function(el){
        setTimeout(function(){ el.classList.add('show'); }, 100);
      });

      document.querySelectorAll('.nav-links a').forEach(function(link){ link.classList.remove('active'); });
      var active = document.getElementById('link-' + page);
      if (active) active.classList.add('active');

      document.getElementById("navLinks").classList.remove("active");

      if (page === 'vote') bindVoteForm();
    }

    function isVotingClosed() {
      if (!VOTE_CLOSE_DATE) return false;
      var end = new Date(VOTE_CLOSE_DATE);
      if (isNaN(end.getTime())) return false;
      return new Date() > end;
    }

    function isVotingNotYetOpen() {
      if (!VOTE_OPEN_DATE) return false;
      var start = new Date(VOTE_OPEN_DATE);
      if (isNaN(start.getTime())) return false;
      return new Date() < start;
    }

    function formatDate(dateStr) {
      var d = new Date(dateStr);
      return d.toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
    }

    function formatDeadline() {
      var end = new Date(VOTE_CLOSE_DATE);
      return end.toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' }) +
             ' at ' + end.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
    }

    function bindVoteForm() {
      var wrap = document.querySelector('.vote-wrap');

      // 1a) Voting not open yet
      if (isVotingNotYetOpen()) {
        if (wrap) {
          wrap.innerHTML =
            '<div class="vote-notopen"><h2>Voting Opens Soon \uD83D\uDD52</h2>' +
            '<p>Voting for <strong>Light Up Your Community!</strong> opens on ' + formatDate(VOTE_OPEN_DATE) + '.</p>' +
            '<p>Voting period: ' + formatDate(VOTE_OPEN_DATE) + ' to ' + formatDate(VOTE_CLOSE_DATE) + '. Please check back then to cast your vote!</p>' +
            '<a onclick="loadPage(\'home\')" class="btn">Back to Home</a></div>';
        }
        return;
      }

      // 1b) Voting deadline check
      if (isVotingClosed()) {
        if (wrap) {
          wrap.innerHTML =
            '<div class="vote-closed"><h2>Voting Has Closed \u23F0</h2>' +
            '<p>Thank you for participating! Voting for the <strong>Light Up Your Community!</strong> project ended on ' + formatDeadline() + '.</p>' +
            '<p>The winning state will be announced soon. Super Members in the Super House... We Moove!!!</p>' +
            '<a onclick="loadPage(\'home\')" class="btn">Back to Home</a></div>';
        }
        return;
      }

      var form = document.getElementById('voteForm');
      var status = document.getElementById('formStatus');
      var emailInput = form ? form.querySelector('input[name="email"]') : null;
      var emailError = document.getElementById('emailError');
      var deadlineNote = document.getElementById('voteDeadline');
      if (!form) return;

      // Show the voting period under the form
      if (deadlineNote) {
        deadlineNote.textContent = 'Voting period: ' + formatDate(VOTE_OPEN_DATE) + ' to ' + formatDeadline() + '.';
      }

      var emailRe = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

      // 2) Live email-format validation
      function checkEmail() {
        if (!emailInput) return true;
        var v = emailInput.value.trim();
        if (v && !emailRe.test(v)) {
          emailInput.classList.add('touched');
          if (emailError) emailError.textContent = 'Please enter a valid email address (e.g. name@example.com).';
          return false;
        }
        if (emailError) emailError.textContent = '';
        return true;
      }
      if (emailInput) emailInput.addEventListener('blur', checkEmail);

      form.addEventListener('submit', function(e){
        e.preventDefault();
        status.className = 'form-status';

        // Re-check the voting window at submit time
        if (isVotingNotYetOpen()) {
          status.className = 'form-status err';
          status.textContent = 'Voting has not opened yet.';
          return;
        }
        if (isVotingClosed()) {
          status.className = 'form-status err';
          status.textContent = 'Sorry, voting has just closed.';
          return;
        }

        if (!checkEmail()) {
          status.className = 'form-status err';
          status.textContent = 'Please fix the highlighted field.';
          if (emailInput) emailInput.focus();
          return;
        }

        status.textContent = 'Sending your vote...';

        var data = new FormData(form);
        fetch(FORM_ENDPOINT, {
          method: 'POST',
          body: data,
          headers: { 'Accept': 'application/json' }
        }).then(function(res){ return res.json().then(function(d){ return { ok: res.ok, body: d }; }); })
        .then(function(r){
          if (r.ok && (r.body.success === 'true' || r.body.success === true)) {
            document.querySelector('.vote-wrap').innerHTML =
              '<div class="thankyou"><h2>Thank you for voting! \uD83C\uDF89</h2>' +
              '<p>Your vote for the <strong>Light Up Your Community!</strong> project has been recorded and sent to our team. A confirmation has been sent to your email.</p>' +
              '<p>Super Members in the Super House... We Moove!!!</p>' +
              '<a onclick="loadPage(\'home\')" class="btn">Back to Home</a></div>';
          } else {
            status.className = 'form-status err';
            status.textContent = (r.body && r.body.message) ? r.body.message : 'Something went wrong. Please try again.';
          }
        }).catch(function(){
          status.className = 'form-status err';
          status.textContent = 'Network error. Please check your connection and try again.';
        });
      });
    }

    window.onload = function(){ loadPage('home'); };
  </script>
</body>
</html>
